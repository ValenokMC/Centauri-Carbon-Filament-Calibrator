# Filament Lab is distributed as a single OrcaSlicer plugin file built by
# plugin/build.py, not as a package you install with pip. This file exists so the
# metadata has one home and the test tooling is configured in the usual place.
[project]
name = "filament-lab"
version = "2.0.0.dev0"
description = "Filament calibration tab for OrcaSlicer 2.5."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ValenokMC"}]
keywords = ["orcaslicer", "filament", "calibration", "3d-printing", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
]
# What the plugin declares in its own metadata; OrcaSlicer installs these.
dependencies = ["trimesh>=4.7", "numpy", "shapely", "mapbox-earcut", "DracoPy", "scipy"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/ValenokMC/OrcaSlicer-Calibration-Plugin"
Changelog = "https://github.com/ValenokMC/OrcaSlicer-Calibration-Plugin/blob/main/CHANGELOG.md"
Issues = "https://github.com/ValenokMC/OrcaSlicer-Calibration-Plugin/issues"
Funding = "https://pay.cloudtips.ru/p/5440d07c"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::SyntaxWarning"]
