<!doctype html>
<html lang="ru" data-theme="dark" data-view="plastic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filament Lab</title>
<style>
/* Orca подмешивает в страницу свою тему: правила для голых тегов body, button, input,
   select, table. Они перебивают наши правила той же силы, поэтому всё, что касается
   тегов, здесь усилено вторым селектором (html body, .app button и т. п.). */
:root{
  --bg:oklch(17% .03 265); --card:oklch(100% 0 0 / .055); --card2:oklch(100% 0 0 / .1);
  --fg:oklch(96% .01 265); --muted:oklch(74% .03 265); --line:oklch(100% 0 0 / .13);
  --field:oklch(0% 0 0 / .25); --menu:oklch(22% .03 265); --menu-hi:oklch(100% 0 0 / .1);
  color-scheme:dark;
  --acc:oklch(86% .13 180); --acc2:oklch(84% .1 225); --on-acc:oklch(22% .04 200);
  --ok:oklch(86% .16 150); --warn:oklch(84% .15 85); --bad:oklch(78% .13 22);
  --shadow:0 18px 44px oklch(0% 0 0 / .35); --blob:.5;
  --text:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
[data-theme=light]{
  --bg:oklch(95% .015 265); --card:oklch(100% 0 0 / .6); --card2:oklch(100% 0 0 / .9);
  --fg:oklch(24% .04 265); --muted:oklch(48% .04 265); --line:oklch(30% .05 265 / .14);
  --field:oklch(100% 0 0 / .75); --menu:oklch(99% .004 265); --menu-hi:oklch(58% .11 185 / .13);
  color-scheme:light;
  --acc:oklch(58% .11 185); --acc2:oklch(56% .13 235); --on-acc:oklch(99% 0 0);
  --ok:oklch(52% .14 150); --warn:oklch(55% .13 70); --bad:oklch(52% .18 25);
  --shadow:0 16px 40px oklch(40% .06 265 / .14); --blob:.36;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html:root{background:var(--bg)}
html body{font:15px/1.5 var(--text);color:var(--fg);background:var(--bg);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
html button,html input,html select{font:inherit}
.app button,.dlg button{color:var(--fg);cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.blob{position:fixed;border-radius:50%;filter:blur(100px);opacity:var(--blob);z-index:0;pointer-events:none}
.b1{width:540px;height:540px;background:oklch(70% .13 180);left:-160px;top:-180px}
.b2{width:580px;height:580px;background:oklch(55% .2 275);right:-200px;top:8%}
.b3{width:460px;height:460px;background:oklch(78% .15 75);left:32%;bottom:-300px;opacity:calc(var(--blob)*.5)}

.app{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:20px;display:grid;gap:16px;
  grid-template-columns:clamp(300px,23vw,340px) minmax(0,1fr) 320px;grid-template-areas:"top top top" "side main right" "foot foot foot"}
.glass{background:var(--card);border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);box-shadow:var(--shadow)}
header{grid-area:top;display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap}
header h1{font:650 19px/1.2 var(--display);margin:0;color:var(--fg);letter-spacing:-.01em}
.logo{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center}
.logo svg{display:block;width:100%;height:100%}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
header button.chip{color:var(--muted)}
header button.chip:hover{color:var(--fg)}
aside{grid-area:side;padding:14px;align-self:start}
main{grid-area:main;display:grid;gap:16px;min-width:0;align-content:start}
.right{grid-area:right;display:grid;gap:16px;align-self:start}
footer{grid-area:foot;font-size:12.5px;color:var(--muted)}
body h2{font:600 12px/1.3 var(--text);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:2px 4px 10px}

/* список катушек */
.spool{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:10px 11px;border-radius:15px;border:1px solid transparent;background:none}
.spool-filter{margin-bottom:9px}
.app .spool-filter .drop-btn{padding:8px 11px;border-radius:11px;font-size:13px}
.spool-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;align-items:center;border:1px solid transparent;border-radius:12px}
.spool-row:hover,.spool-row.on{background:var(--card2)}
.spool-row.on{border-color:var(--line)}
.spool-row .spool{display:flex;min-width:0;padding:7px;gap:8px}
.spool-row .spool b{white-space:normal;overflow-wrap:anywhere}
.spool-info{min-width:0}
.material-badge{display:inline-grid;place-items:center;box-sizing:border-box;flex:none;width:76px;height:30px;border-radius:999px;border:3px solid var(--material-color);color:var(--fg);font-size:13px;font-weight:700;line-height:1;text-align:center;white-space:nowrap}
.hero .material-badge{width:108px;height:45px;border-width:4px;font-size:17px}
.app .spool-remove{width:30px;height:32px;display:grid;place-items:center;border:0;border-radius:7px;background:none;color:var(--muted)}
.app .spool-remove:hover,.app .spool-remove:focus-visible{color:var(--bad);background:var(--card)}
.spool-remove svg{width:15px;height:15px}
.spool-pages{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:8px}
.spool-pages span{font-size:12px;color:var(--muted);white-space:nowrap}
.spool-pages button{padding:3px 9px}
#removeDialog{margin:auto;color:var(--fg);border:1px solid var(--line);background:var(--card2)}
#removeDialog::backdrop{background:#080e1aaa}
.spool b{display:block;font-weight:600;font-size:14.5px;overflow-wrap:anywhere;line-height:1.25}
.spool small{color:var(--muted);font-size:12.5px}
.cnt{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.cnt.full{color:var(--ok)}
.app .spool.new{margin-top:8px;justify-content:center;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.app .spool.new:hover{color:var(--fg)}

/* шапка катушки и дорожка тестов */
.hero{padding:18px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h3{margin:0;font:650 26px/1.15 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere;color:var(--fg)}
.hero p{margin:3px 0 0;color:var(--muted);font-size:14px}
.meter{width:150px}
.meter b{font:650 15px var(--display)}
.meter i{display:block;height:7px;border-radius:9px;background:var(--card2);margin-top:6px;overflow:hidden}
.meter i::after{content:"";display:block;height:100%;width:var(--w);border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.extra-tests{padding:12px 14px;min-width:0}
.extra-tests summary{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--muted);list-style:none}
.extra-tests summary::-webkit-details-marker{display:none}
.extra-tests summary:hover,.extra-tests[open] summary{color:var(--fg)}
.extra-items{display:grid;gap:5px;margin-top:8px}
.app .extra-test{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;align-items:center;gap:10px;width:100%;padding:8px 10px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.app .extra-test:hover,.app .extra-test[aria-pressed=true]{border-color:var(--acc);background:var(--card2)}
.extra-test strong,.extra-test small{display:block}
.extra-test small{color:var(--muted);font-size:12px}
.extra-value{white-space:nowrap;font-size:14px;font-weight:650}
.extra-chevron{width:7px;height:7px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.extra-tests[open] summary .extra-chevron{transform:rotate(225deg)}
.extra-test .extra-chevron{transform:rotate(-45deg)}
.step{padding:12px 13px;border-radius:17px;text-align:left;position:relative;transition:transform .15s,border-color .15s}
.step:hover{transform:translateY(-2px)}
.step.on{background:var(--card2);border-color:var(--acc)}
.step .n{font-size:12px;color:var(--muted)}
.step .t{font-weight:600;font-size:14.5px;margin:1px 0 8px;line-height:1.2}
.step .v{font:650 21px/1.1 var(--display)}
.step .v small{font:500 12px var(--text);color:var(--muted)}
.st{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--line)}
.st.замер{background:var(--ok)}.st.вручную{background:var(--warn)}.st.ошибка{background:var(--bad)}
.next{position:absolute;top:8px;right:9px;font-size:10.5px;padding:1px 8px;border-radius:99px;background:var(--acc);color:var(--on-acc);font-weight:700}

/* рабочая карточка: три шага */
.work{padding:6px 22px 20px}
.work>h4{font:650 22px/1.2 var(--display);margin:16px 0 0;color:var(--fg);letter-spacing:-.015em}
.stage{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0;padding-bottom:0}
.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:650 16px var(--display);background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.stage h5{margin:0 0 4px;font:600 16.5px/1.3 var(--display);color:var(--fg)}
.stage p{margin:0;color:var(--muted);max-width:62ch;text-wrap:pretty}
.stage ol{margin:8px 0 0;padding-left:20px;color:var(--muted);max-width:66ch}
.stage li{margin:3px 0}
.pick{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
.pick button{min-width:60px;padding:10px 9px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px}
.pick button:hover{background:var(--card2)}
#work .pick button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on-acc);border-color:transparent;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
body input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
body input[type=number],body input[type=text],body select{padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);min-width:0}
body input[type=number]{width:130px;font:600 18px var(--display)}
body select option{background:var(--bg);color:var(--fg)}
label.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin:10px 0 0;max-width:62ch}
.calc{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--card2);border:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.calc .big{font:700 34px/1 var(--display);color:var(--acc);letter-spacing:-.02em}
.calc.err .big{color:var(--bad);font:600 15px/1.4 var(--text);letter-spacing:0}
.calc .why{color:var(--muted);font-size:13.5px}
.btns{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 18px;border-radius:13px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:15px;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.app .btn.pri,.dlg .btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on-acc);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.done{color:var(--ok);font-size:13.5px;font-weight:600}

/* правая колонка */
.card{padding:16px 18px}
body table{width:100%;border-collapse:collapse;font-size:14px;background:none}
body td,body th{padding:7px 4px;text-align:right;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg)}
body td:first-child,body th:first-child{text-align:left;color:var(--muted)}
body th{font-weight:500;color:var(--muted);font-size:12px}
body tr:last-child td{border-bottom:0}
body tr:hover td{background:none}
.bar{display:grid;grid-template-columns:112px 1fr 42px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.bar span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar .trk{background:var(--card2);border-radius:9px}
.bar.me span:first-child{color:var(--fg);font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.msg{display:flex;gap:9px;font-size:14px;margin:8px 0;align-items:flex-start}
.msg::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--muted)}
.msg.хорошо::before{background:var(--ok)}.msg.внимание::before{background:var(--warn)}.msg.плохо::before{background:var(--bad)}

.banner{padding:12px 18px;font-size:14.5px;display:none;gap:10px;align-items:center}
.banner.show{display:flex}
.banner.warn{border-color:var(--warn)}.banner.bad{border-color:var(--bad)}
.app .banner button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 90px;padding:12px 20px;border-radius:15px;z-index:9;transition:translate .3s;font-weight:600;max-width:90vw}
.toast.show{translate:-50% 0}
.veil{position:fixed;inset:0;background:oklch(10% .03 265 / .55);z-index:8;display:none;place-items:safe center;padding:16px;overflow-y:auto}
.veil.show{display:grid}
.dlg{width:min(460px,100%);padding:22px;display:grid;gap:13px}
.dlg h4{margin:0;font:650 20px var(--display);color:var(--fg)}
.dlg label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
/* Все выпадающие списки панели свои, а не системные: окно <select> и подсказки
   <datalist> рисует Windows — белым в тёмной теме и чужим шрифтом. Два вида с одним
   оформлением: .combo — поле, куда можно вписать своё (производитель), и .drop —
   выбор из готового списка (материал, базовый профиль, фильтр катушек). У .drop
   настоящий <select> остаётся спрятанным рядом и хранит значение. */
.combo-field{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.combo,.drop{position:relative;display:grid}
.dlg .combo input{width:100%;padding-right:40px}
.dlg .combo-toggle{position:absolute;top:0;right:0;bottom:0;width:38px;border:0;border-radius:0 12px 12px 0;background:none;display:grid;place-items:center}
.combo-toggle::after,.drop-btn::after{content:"";flex:none;width:7px;height:7px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg)}
.combo-toggle:hover::after,.combo input[aria-expanded=true]+.combo-toggle::after,.drop-btn:hover::after,.drop-btn[aria-expanded=true]::after{border-color:var(--fg)}
.combo input[aria-expanded=true]+.combo-toggle::after,.drop-btn[aria-expanded=true]::after{transform:translateY(2px) rotate(225deg)}
.combo input[aria-expanded=true],.app .drop-btn[aria-expanded=true],.dlg .drop-btn[aria-expanded=true]{border-color:var(--acc)}
.app .drop-btn,.dlg .drop-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-width:0;padding:10px 13px;
  border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);font-size:14px;text-align:left;cursor:pointer}
/* Поля формы тем же кеглем, что и кнопки списков: иначе input наследует 13px от подписи. */
.dlg input[type=text]{font-size:14px}
.drop-btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop-btn:disabled{opacity:.55;cursor:default}
.drop select{display:none}
.combo-list,.drop-list{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:5;margin:0;padding:5px;list-style:none;
  max-height:228px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--menu);box-shadow:var(--shadow);
  scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
.combo-list[hidden],.drop-list[hidden]{display:none}
.combo-list.up,.drop-list.up{top:auto;bottom:calc(100% + 5px)}
.combo-list::-webkit-scrollbar,.drop-list::-webkit-scrollbar{width:8px}
.combo-list::-webkit-scrollbar-thumb,.drop-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.combo-list::-webkit-scrollbar-thumb:hover,.drop-list::-webkit-scrollbar-thumb:hover{background:var(--muted)}
body .combo-list li,body .drop-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:8px 11px;
  border-radius:8px;font-size:14px;color:var(--fg);background:none;cursor:pointer;overflow-wrap:anywhere}
body .combo-list li[aria-selected=true],body .drop-list li.active{background:var(--menu-hi);box-shadow:inset 3px 0 0 var(--acc)}
body .drop-list li[aria-selected=true]{font-weight:650}
body .drop-list li[aria-selected=true]::after{content:"";flex:none;width:5px;height:10px;border:solid var(--acc);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.combo-list mark{background:none;color:var(--acc);font-weight:650}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
details summary{cursor:pointer}
details.note[open]{max-width:66ch}
body pre{background:none;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
/* два раздела: «Пластик» (.f) и «Принтер» (.p) */
[data-view=plastic] .p,[data-view=printer] .f{display:none}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.app .seg button{border:0;background:none;padding:6px 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.app .seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on-acc)}
.grp{font:600 12px/1.3 var(--text);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 6px 6px}
.dotrow{display:flex;gap:10px;align-items:flex-start;margin:9px 0;font-size:14px}
.dotrow::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--bad)}
.dotrow.ok::before{background:var(--ok)}
.dotrow b{display:block;font-weight:600}
.dotrow span{color:var(--muted);font-size:13px}
.sym{font-size:13.5px;margin:9px 0;line-height:1.35}
.sym b{display:block;font-weight:600}
.sym span{color:var(--muted)}
.logrow{font-size:13px;margin:9px 0;padding-bottom:9px;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.logrow b{font-weight:600}
.logrow span{color:var(--muted);display:block;overflow-wrap:anywhere}
.app .btn.arm{border-color:var(--warn);color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1180px){.app{grid-template-columns:clamp(270px,30vw,310px) minmax(0,1fr);grid-template-areas:"top top" "side main" "right right" "foot foot"}.right{grid-template-columns:1fr 1fr}}
@media (max-width:800px){.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "side" "main" "right" "foot";padding:14px}.chain{grid-template-columns:repeat(3,minmax(0,1fr))}.right{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="app">
  <header class="glass">
    <div class="logo"><!-- @@ICON@@ --></div><h1 id="title">Filament Lab</h1>

    <span class="sp"></span>
    <span class="chip" id="printer"></span>
    <button class="chip" id="theme" title="Сменить тему"></button>
  </header>

  <aside class="glass f"><h2>Катушки</h2>
    <div class="spool-filter"><select id="spoolFilter" data-drop aria-label="Фильтр по материалу"></select></div>
    <div id="spools"></div><nav id="spoolPages" aria-label="Страницы списка катушек"></nav>
    <button class="spool new" id="add">+ Новая катушка</button></aside>
  <dialog id="removeDialog" class="glass" aria-labelledby="removeTitle">
    <form class="dlg" method="dialog">
      <h4 id="removeTitle">Удалить катушку?</h4>
      <div id="removeText"></div>
      <div class="btns"><button class="btn" id="cancelRemove" value="cancel" autofocus>Отмена</button>
        <button class="btn arm" id="doRemove" type="button">Удалить</button></div>
    </form>
  </dialog>

  <main>
    <div class="glass banner" id="banner"><span id="bannerText"></span><button id="bannerX" aria-label="Скрыть">×</button></div>
    <div id="content" class="f"></div>
  </main>

  <div class="right f">
    <details class="glass extra-tests" id="extraTests" hidden>
      <summary>Дополнительные тесты<span class="extra-chevron" aria-hidden="true"></span></summary>
      <div class="extra-items" id="extraItems"></div>
    </details>
    <section class="glass card"><h2 style="margin-left:0">Что в пресете</h2>
      <table id="preset"></table><div class="note" id="home"></div></section>
    <section class="glass card" id="nozzleCard"><h2 style="margin-left:0">Другие сопла</h2>
      <table id="nozzles"></table><div class="note" id="nozzleNote"></div>
      <div class="btns" id="nozzleBtn"></div></section>
    <section class="glass card"><h2 style="margin-left:0">Сейчас выбрано в Orca</h2>
      <div id="check"><div class="note">Проверяю…</div></div></section>
    <section class="glass card"><h2 style="margin-left:0">Макс. расход, мм³/с</h2><div id="bars"></div></section>
  </div>

  <footer><details id="diag"><summary>Диагностика</summary><pre id="diagText"></pre></details></footer>
</div>

<div class="veil" id="veil"><form class="glass dlg" id="dlg">
  <h4>Новая катушка</h4>
  <div class="combo-field"><span class="field-label" id="nMatLabel">Материал</span><select id="nMat" data-drop aria-labelledby="nMatLabel"></select></div>
  <div class="combo-field"><span class="field-label" id="nBaseLabel">Базовый профиль Orca</span><select id="nBase" data-drop aria-labelledby="nBaseLabel"></select></div>
  <p class="note" id="nBaseInfo"></p>
  <div class="combo-field"><label for="nVendor">Производитель</label>
    <div class="combo"><input type="text" id="nVendor" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="vendorList" autocomplete="off" placeholder="ELEGOO" required>
      <button type="button" class="combo-toggle" id="vendorToggle" tabindex="-1" aria-label="Показать производителей"></button>
      <ul class="combo-list" id="vendorList" role="listbox" aria-label="Производители" hidden></ul></div></div>
  <label>Название с этикетки<input type="text" id="nName" placeholder="Matte PLA" required></label>
  <div class="note" id="nPreview"></div>
  <div class="btns"><button class="btn pri" type="submit">Завести</button><button class="btn" type="button" id="nCancel">Отмена</button></div>
</form></div>
<div class="toast glass" id="toast"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── выпадающие списки ──
   <select data-drop> получает свою кнопку и свой список в цветах темы. Сам select
   остаётся спрятанным: в нём лежат варианты и значение, так что остальной код
   по-прежнему пишет select.innerHTML, читает select.value и ловит onchange.
   Значение, выставленное из кода (select.value = …), показывает dropRefresh(). */
let dropSeq=0;
function dropRefresh(select){
  const d=select&&select._drop;if(!d)return;
  const option=select.options[select.selectedIndex];
  d.label.textContent=option?option.textContent:'—';
  d.button.disabled=select.disabled||!select.options.length;
}
function dropClose(d){
  if(d.list.hidden)return;
  d.list.hidden=true;d.button.setAttribute('aria-expanded','false');d.button.removeAttribute('aria-activedescendant');d.active=-1;
}
function dropMove(d,i,scroll){
  const items=[...d.list.children];if(!items.length)return;
  d.active=(i+items.length)%items.length;
  items.forEach((li,k)=>li.classList.toggle('active',k===d.active));
  d.button.setAttribute('aria-activedescendant',items[d.active].id);
  if(scroll)items[d.active].scrollIntoView({block:'nearest'});
}
function dropOpen(d){
  const select=d.select;if(d.button.disabled)return;
  d.list.innerHTML=[...select.options].map((o,i)=>
    `<li role="option" id="${d.id}o${i}" aria-selected="${i===select.selectedIndex}">${esc(o.textContent)}</li>`).join('');
  d.list.hidden=false;d.button.setAttribute('aria-expanded','true');
  // В низком окне Orca под кнопкой может не хватить места — тогда список раскрывается вверх.
  const box=d.button.getBoundingClientRect(),need=Math.min(d.list.scrollHeight,228)+8;
  d.list.classList.toggle('up',innerHeight-box.bottom<need&&box.top>innerHeight-box.bottom);
  dropMove(d,Math.max(0,select.selectedIndex),true);
}
function dropPick(d,i){
  const select=d.select;dropClose(d);
  if(i<0||i>=select.options.length)return;
  const changed=select.selectedIndex!==i;
  select.selectedIndex=i;dropRefresh(select);
  if(changed)select.dispatchEvent(new Event('change',{bubbles:true}));
}
function dropEnhance(select){
  const id='drop'+(++dropSeq), wrap=document.createElement('div');
  wrap.className='drop';
  wrap.innerHTML=`<button type="button" class="drop-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="${id}"><span></span></button>`
    +`<ul class="drop-list" id="${id}" role="listbox" hidden></ul>`;
  select.replaceWith(wrap);wrap.appendChild(select);
  const d={select,id,button:wrap.querySelector('.drop-btn'),label:wrap.querySelector('.drop-btn span'),list:wrap.querySelector('.drop-list'),active:-1,typed:'',typedAt:0};
  select._drop=d;
  if(select.getAttribute('aria-labelledby'))d.button.setAttribute('aria-labelledby',select.getAttribute('aria-labelledby'));
  if(select.getAttribute('aria-label'))d.button.setAttribute('aria-label',select.getAttribute('aria-label'));
  d.list.setAttribute('aria-label',select.getAttribute('aria-label')||($(select.getAttribute('aria-labelledby'))||{}).textContent||'');
  d.button.onclick=()=>d.list.hidden?dropOpen(d):dropClose(d);
  d.button.addEventListener('blur',()=>dropClose(d));
  d.button.addEventListener('keydown',e=>{
    const open=!d.list.hidden, n=select.options.length;
    if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
      e.preventDefault();
      if(!open){dropOpen(d);return}
      dropMove(d,e.key==='Home'?0:e.key==='End'?n-1:d.active+(e.key==='ArrowDown'?1:-1),true);
    }else if(e.key==='Enter'||e.key===' '){
      if(!open)return;          // закрытый список Enter/пробел откроет обычным нажатием кнопки
      e.preventDefault();dropPick(d,d.active);
    }else if(e.key==='Escape'&&open){
      e.preventDefault();e.stopPropagation();dropClose(d);
    }else if(e.key==='Tab'){
      dropClose(d);
    }else if(e.key.length===1&&/\S/.test(e.key)){
      // Набор с клавиатуры: переход к первому варианту, который начинается с набранного.
      const now=Date.now();d.typed=(now-d.typedAt<700?d.typed:'')+e.key.toLowerCase();d.typedAt=now;
      const from=open?d.active:select.selectedIndex, opts=[...select.options];
      for(let k=1;k<=n;k++){
        // Одна буква — следующий подходящий; несколько — начиная с текущего.
        const i=(Math.max(from,0)+(d.typed.length>1?k-1:k))%n;
        if(opts[i].textContent.toLowerCase().startsWith(d.typed)){open?dropMove(d,i,true):dropPick(d,i);break}
      }
    }
  });
  // Нажатие в списке не должно уводить фокус с кнопки, иначе список закроется до выбора.
  d.list.addEventListener('mousedown',e=>e.preventDefault());
  d.list.addEventListener('click',e=>{const li=e.target.closest('li');if(li)dropPick(d,[...d.list.children].indexOf(li))});
  d.list.addEventListener('mousemove',e=>{const li=e.target.closest('li');if(li&&!li.classList.contains('active'))dropMove(d,[...d.list.children].indexOf(li),false)});
  // Варианты меняет остальной код (innerHTML) — подпись на кнопке следует за ними.
  new MutationObserver(()=>{dropRefresh(select);if(!d.list.hidden)dropClose(d)}).observe(select,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});
  dropRefresh(select);
}
document.querySelectorAll('select[data-drop]').forEach(dropEnhance);
const HUES=[350,255,165,85,300,25,205,55];
// Цвет катушки — от имени, а не от места в списке: новая катушка не должна перекрашивать остальные.
const color=n=>{let h=0;for(const c of String(n))h=(h*31+c.codePointAt(0))>>>0;return `oklch(74% .15 ${HUES[h%HUES.length]})`};
const HOST=window.orca||null;
let S=null, sel=null, tst=null, draft=null, repeat=true, loaded={}, seq=0;
const wait=new Map(), log=[];

function send(действие, extra){
  return new Promise(res=>{
    if(!HOST){res({ок:false,ошибка:'Страница открыта без Orca и без dev_server.py — данных нет.'});return}
    const id=++seq; wait.set(id,res); HOST.postMessage(Object.assign({id,действие},extra||{}));
    // Срок большой: Orca может показать окно разрешения, и ответ придёт после него.
    setTimeout(()=>{if(wait.has(id)){wait.delete(id);res({ок:false,ошибка:'Нет ответа на «'+действие+'»'})}},180000);
  });
}
if(HOST) HOST.onMessage(d=>{
  if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){return}}
  if(d&&d.событие){ if(/Preset/.test(d.событие)) check(); return }
  const r=d&&wait.get(d.id); if(r){wait.delete(d.id); r(d)}
});
// Плавные переходы браузера (view transitions) здесь отключены намеренно: они откладывают
// перерисовку до следующего кадра, и на притормаживающей странице щелчок «не срабатывал».
const smooth=fn=>fn();

/* ── тема ── */
const THEMES=['auto','dark','light'], TNAME={auto:'Тема: авто',dark:'Тема: тёмная',light:'Тема: светлая'};
let theme='auto';
function hostIsDark(){
  // Orca подсовывает свою тему переменной --orca-bg; вне Orca её нет — смотрим на систему.
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--orca-bg').trim();
  let rgb=null, h=bg.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(h){const s=h[1].length===3?h[1].replace(/./g,'$&$&'):h[1];rgb=[0,2,4].map(i=>parseInt(s.substr(i,2),16))}
  else if(/^rgb/i.test(bg)) rgb=bg.match(/\d+/g).slice(0,3).map(Number);
  if(rgb) return (rgb[0]*299+rgb[1]*587+rgb[2]*114)/1000<128;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  document.documentElement.dataset.theme=theme==='auto'?(hostIsDark()?'dark':'light'):theme;
  $('theme').textContent=TNAME[theme];
}
$('theme').onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];applyTheme();send('настройка',{ключ:'тема',значение:theme})};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

/* ── помощники ── */
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2800)}
function banner(text,kind){$('bannerText').textContent=text;$('banner').className='glass banner show '+(kind||'')}
$('bannerX').onclick=()=>$('banner').classList.remove('show');
const spool=()=>S&&S.катушки.find(k=>k.имя===sel);
const tests=k=>S.материалы[k.материал].тесты;
const test=()=>{const k=spool();return k&&tests(k).find(t=>t.ключ===tst)};
const nextKey=k=>tests(k).find(t=>!t.необязательный&&(!k.значения[t.ключ]||k.значения[t.ключ].статус==='ошибка'))?.ключ;
const fmt=(v,d)=>Number(v).toFixed(d);
function fail(r){ if(r.след) log.unshift(r.след); banner(r.ошибка||'Не получилось','bad'); diag() }

/* ── список, шапка, дорожка ── */
const perPage=8;
let spoolPage=0, spoolMaterial='', removeTarget=null;
const spoolOrder=new Intl.Collator('ru',{numeric:true,sensitivity:'base'});
const sortedSpools=()=>[...S.катушки].sort((a,b)=>
  spoolOrder.compare(a.материал,b.материал)||spoolOrder.compare(a.имя,b.имя));
let lastOrcaSpool=null;
function followOrcaSpool(выбор){
  if(!S||!выбор)return false;
  const name=выбор.катушка_первого_слота;
  if(name===lastOrcaSpool)return false;
  lastOrcaSpool=name;
  const ordered=sortedSpools();
  let index=ordered.findIndex(k=>k.имя===name);
  if(index<0)index=ordered.findIndex(k=>k.имя.replace(/[\/\\:*?"<>|]/g,'_')===name);
  if(index<0||ordered[index].имя===sel)return false;
  sel=ordered[index].имя;
  tst=null;
  draft=null;
  spoolMaterial='';
  spoolPage=Math.floor(index/perPage);
  return true;
}
const materialColors=new Map(Object.entries({
  PLA:'#55b8f0', PETG:'#24c9ae', 'PETG-CF':'#239c7b', 'PETG-GF':'#8dbb44',
  ASA:'#f5ad4f', ABS:'#f17875', PA:'#a78bfa', TPU:'#df85c4'
}));
const materialBadge=material=>`<span class="material-badge" style="--material-color:${materialColors.get(material)||color(material)}">${esc(material)}</span>`;
const trashIcon='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h13m-10 0V3h7v2.5m1.5 0-.8 11h-8.4l-.8-11M8 8.5v5m4-5v5"/></svg>';
function renderSpools(){
  if(!S)return;
  const ordered=sortedSpools();
  const materials=[...new Set(ordered.map(k=>k.материал))];
  if(!materials.includes(spoolMaterial))spoolMaterial='';
  $('spoolFilter').innerHTML=['',...materials].map(m=>`<option value="${esc(m)}">${esc(m||'Все материалы')}</option>`).join('');
  $('spoolFilter').value=spoolMaterial;dropRefresh($('spoolFilter'));
  const results=ordered.filter(k=>!spoolMaterial||k.материал===spoolMaterial);
  const pages=Math.max(1,Math.ceil(results.length/perPage));
  spoolPage=Math.min(spoolPage,pages-1);
  const from=spoolPage*perPage;
  $('spools').innerHTML=results.slice(from,from+perPage).map(k=>`
    <div class="spool-row${k.имя===sel?' on':''}">
      <button class="spool" data-n="${esc(k.имя)}" aria-pressed="${k.имя===sel}" title="${esc(k.имя)}">
        ${materialBadge(k.материал)}
        <span class="spool-info"><b>${esc(k.имя)}</b>
        <small class="cnt${k.готово===k.всего?' full':''}">${k.готово===k.всего?'Готово':k.готово+' из '+k.всего}</small></span>
      </button>
      <button class="spool-remove" data-n="${esc(k.имя)}" aria-label="Удалить ${esc(k.имя)}" title="Удалить катушку">${trashIcon}</button>
    </div>`).join('')||`<div class="note" style="padding:8px">${S.катушки.length?'Катушки не найдены.':'Пока ни одной катушки.'}</div>`;
  $('spoolPages').innerHTML=pages>1?`<div class="spool-pages">
    <button class="btn" id="pagePrev" aria-label="Предыдущая страница" ${spoolPage===0?'disabled':''}>‹</button>
    <span>${from+1}–${Math.min(from+perPage,results.length)} из ${results.length}</span>
    <button class="btn" id="pageNext" aria-label="Следующая страница" ${spoolPage===pages-1?'disabled':''}>›</button>
  </div>`:'';
  if($('pagePrev'))$('pagePrev').onclick=()=>{spoolPage--;renderSpools();($('pagePrev').disabled?$('pageNext'):$('pagePrev')).focus()};
  if($('pageNext'))$('pageNext').onclick=()=>{spoolPage++;renderSpools();($('pageNext').disabled?$('pagePrev'):$('pageNext')).focus()};
}
$('spoolFilter').onchange=()=>{spoolMaterial=$('spoolFilter').value;spoolPage=0;renderSpools()};
$('spools').onclick=e=>{
  const button=e.target.closest('button[data-n]');
  if(!button)return;
  if(button.classList.contains('spool-remove')){
    removeTarget=button.dataset.n;
    $('removeText').textContent=`«${removeTarget}» исчезнет из списка. Замеры и пресеты сохранятся в архиве.`;
    $('removeDialog').showModal();
    return;
  }
  smooth(()=>{sel=button.dataset.n;tst=null;draft=null;renderAll()});
};
$('removeDialog').addEventListener('cancel',e=>{if($('doRemove').disabled)e.preventDefault()});
$('doRemove').onclick=async()=>{
  const имя=removeTarget;
  $('doRemove').disabled=$('cancelRemove').disabled=true;
  try{
    const r=await send('убрать',{катушка:имя});
    $('removeDialog').close();
    if(r.ок&&sel===имя){sel=null;tst=null;draft=null}
    done(r);
  }finally{
    $('doRemove').disabled=$('cancelRemove').disabled=false;
  }
};
function renderAll(){
  if(!S) return;
  $('printer').textContent=S.принтер||'принтер не задан';
  if(!sel||!spool()) sel=(sortedSpools().find(k=>!spoolMaterial||k.материал===spoolMaterial)||sortedSpools()[0])?.имя??null;
  const k=spool();
  if(k&&(!tst||!test())) tst=nextKey(k)||tests(k)[0].ключ;
  renderSpools();
  if(!k){$('content').innerHTML='<div class="glass empty">Заведи первую катушку — кнопка слева.</div>';$('preset').innerHTML='';$('home').textContent='';$('bars').innerHTML='';$('extraTests').hidden=true;return}
  const T=tests(k), nk=nextKey(k), сушка=k.сушка||{};
  const extra=T.filter(t=>t.необязательный);
  $('content').innerHTML=`
    <section class="glass hero">${materialBadge(k.материал)}
      <div><h3>${esc(k.имя)}</h3>${сушка.температура?`<p>Перед калибровкой просушить: ${esc(сушка.температура)} °C, ${esc(сушка.часы)} ч</p>`:''}</div><span class="sp"></span>
      <div class="meter"><b>${k.готово===k.всего?'Откалибрована':'Готово '+k.готово+' из '+k.всего}</b><i style="--w:${k.готово/k.всего*100}%"></i></div></section>
    <section class="chain" style="margin-top:16px">${T.filter(t=>!t.необязательный).map(t=>{const v=k.значения[t.ключ];return `<button class="glass step${t.ключ===tst?' on':''}" data-k="${esc(t.ключ)}">
      ${v?`<span class="st ${esc(v.статус)}" title="${esc(v.статус)}"></span>`:(t.ключ===nk?'<span class="next">дальше</span>':'<span class="st"></span>')}
      <div class="n">тест ${t.номер}</div><div class="t">${esc(t.название)}</div>
      <div class="v">${v?esc(v.текст):'—'} <small>${v&&v.статус!=='ошибка'?esc(t.единица):''}</small></div></button>`}).join('')}</section>
    <section class="glass work" style="margin-top:16px" id="work" tabindex="-1"></section>`;
  $('extraTests').hidden=!extra.length;
  $('extraItems').innerHTML=extra.map(t=>{
        const v=k.значения[t.ключ];
        const status=v?({'замер':'Измерен','вручную':'Задан вручную','ошибка':'Ошибка замера'}[v.статус]||'Сохранён'):'Нет замера';
        const result=v&&v.статус!=='ошибка'?`${esc(v.текст)} ${esc(t.единица)}`:'—';
        return `<button class="extra-test" data-k="${esc(t.ключ)}" aria-pressed="${t.ключ===tst}" aria-controls="work">
          <span><strong>${esc(t.название)}</strong><small>${status}</small></span>
          <span class="extra-value">${result}</span><span class="extra-chevron" aria-hidden="true"></span>
        </button>`;
      }).join('');
  document.querySelectorAll('.step').forEach(b=>b.onclick=()=>smooth(()=>{tst=b.dataset.k;draft=null;renderAll()}));
  document.querySelectorAll('.extra-test').forEach(b=>b.onclick=()=>{
    tst=b.dataset.k;
    draft=null;
    renderAll();
    $('work').focus({preventScroll:!matchMedia('(max-width:1180px)').matches});
  });
  $('preset').innerHTML='<tr><th></th><th>заводское</th><th>твоё</th></tr>'+T.map(t=>{const f=t.поля[0];
    return `<tr><td>${esc(t.название)}</td><td>${esc(k.база_поля[f]??'—')}</td><td><b>${esc(k.поля[f]??'—')}</b></td></tr>`}).join('');
  $('home').textContent=(k.дом==='пользовательский'
    ?'Эта катушка заведена до плагина: после замера Orca нужно перезапустить.'
    :'Orca подхватывает изменения сразу, без перезапуска.')+' Замеры сделаны на сопле '+S.сопло+'.';
  renderNozzles(k,T);
  const mv=S.катушки.filter(x=>x.поля.filament_max_volumetric_speed).map(x=>[x,parseFloat(x.поля.filament_max_volumetric_speed)]).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(25,...mv.map(x=>x[1]));
  $('bars').innerHTML=mv.map(([x,v])=>`<div class="bar${x===k?' me':''}"><span title="${esc(x.имя)}">${esc(x.имя)}</span><span class="trk"><i style="width:${v/mx*100}%"></i></span><span>${v.toFixed(1)}</span></div>`).join('')||'<div class="note">Пока нет замеров.</div>';
  renderWork(); diag();
}

/* ── другие сопла: оценка по замерам ── */
function renderNozzles(k,T){
  const ns=Object.keys(S.множители||{}).sort();
  $('nozzleCard').style.display=ns.length?'':'none'; if(!ns.length)return;
  // Показываем только то, что от сопла зависит и уже измерено.
  const rows=T.filter(t=>ns.some(n=>(S.множители[n]||{})[t.поля[0]]!=null)&&k.поля[t.поля[0]]!=null);
  $('nozzles').innerHTML=rows.length?'<tr><th></th>'+ns.map(n=>`<th>${esc(n)}</th>`).join('')+'</tr>'
    +rows.map(t=>`<tr><td>${esc(t.название)}</td>${ns.map(n=>`<td>${esc((k.сопла[n]||{})[t.поля[0]]??'—')}</td>`).join('')}</tr>`).join(''):'';
  $('nozzleNote').textContent=rows.length
    ?'Это оценка, а не замер. Остальные значения перенесены с сопла '+S.сопло+'. После смены сопла проверь выбранный профиль пластика в Orca.'
    :'Появятся после тестов «Pressure Advance» и «Макс. расход».';
  $('nozzleBtn').innerHTML=k.варианты_есть?'':'<button class="btn" id="mkNozzles">Создать пресеты под сопла</button>';
  if($('mkNozzles'))$('mkNozzles').onclick=async()=>done(await send('сопла',{катушки:[k.имя]}));
}

/* ── рабочая карточка: печать → смотрим → замер ── */
function range(a,b,step){const out=[],n=Math.round((b-a)/step);for(let i=0;i<=Math.abs(n);i++)out.push(+(a+i*step*Math.sign(n||1)).toFixed(4));return out}
function renderWork(){
  const k=spool(), t=test(); if(!k||!t) return;
  const p=t.параметры||{}, v=k.значения[t.ключ], prev=v&&v.замер;
  const canRepeat=t.ввод==='сдвиг'&&prev!=null, плита=t.режим==='плита', was=loaded[sel+'|'+tst];
  let input='';
  if(t.ввод==='прямое'&&p.шаг){ const dec=Math.abs(p.шаг)<0.01?3:(Math.abs(p.шаг)<1?2:0);
    input=`<div class="pick">${range(p.старт,p.конец,Math.abs(p.шаг)).map(x=>`<button data-v="${x}">${fmt(x,dec)}</button>`).join('')}</div>
      <div class="row"><span class="note" style="margin:0">или своё число</span><input type="number" id="num" step="${Math.abs(p.шаг)/(dec?5:1)}"></div>`;
  } else if(t.ввод==='сдвиг'){
    input=`<div class="pick">${range(-p.предел,p.предел,p.шаг).map(x=>`<button data-v="${x}">${x>0?'+':x<0?'−':''}${Math.abs(x).toFixed(2)}</button>`).join('')}</div>`
      +(canRepeat?`<label class="chk"><input type="checkbox" id="rep" ${repeat?'checked':''}><span>Это повторная печать: поправка прибавится к уже найденному потоку. Сними галочку, если исправляешь прошлый ввод.</span></label>`:'');
  } else {
    const max=t.ввод==='высота_непрерывно'?Math.ceil((p.конец-p.старт)/p.шаг_на_мм)+2:t.ввод==='таблица'?p.таблица[p.таблица.length-1][0]:0;
    input=`<div class="row"><input type="number" id="num" step="${t.ввод==='размер'?0.01:0.1}" placeholder="${t.ввод==='размер'?'100.03':'0.0'}"><span class="note" style="margin:0">мм</span>
      ${max?`<input type="range" id="rng" min="0" max="${max}" step="0.1" value="0">`:''}</div>`;
  }
  const печать=плита
    ?`<p>Плита уже настроена под этот пластик. Она откроется во вкладке «Подготовка» — там нажми «Нарезать», потом «Печать».</p>`
    :`<p>Открой в Orca <b>«Калибровка → Откат»</b> и введи значения для этой катушки.</p>
      <p>Начало: <b>${esc(p.старт?.toLocaleString('ru-RU')??'—')} мм</b> · Конец: <b>${esc(p.конец?.toLocaleString('ru-RU')??'—')} мм</b> · Шаг: <b>${esc(p.шаг?.toLocaleString('ru-RU')??'—')} мм</b></p>
      <p>Нарежь башню в Orca. После печати введи ниже высоту первого участка без нитей.</p>`;
  $('work').innerHTML=`
    <h4>${esc(t.название)}</h4>
    <div class="stage"><div class="num">1</div><div><h5>Печать${t.время?` <span class="note">· ${esc(t.время)}</span>`:''}</h5>${печать}
      <div class="btns">${плита?`<button class="btn ${v?'':'pri'}" id="open">Загрузить плиту</button>`:'<button class="btn" id="selectSpool">Выбрать катушку в Orca</button>'}
        <span class="done" id="was">${was?'Плита загружена':''}</span></div>
    </div></div>
    <div class="stage"><div class="num">2</div><div><h5>Смотрим</h5><p>${esc(t.смотреть||t.вопрос)}</p>
      <details class="note"><summary>Подробнее</summary>${esc(t.подсказка)}</details>
      ${t.не_выверено?'<p style="color:var(--warn)">Шкала этого теста ещё не выверена на живой печати.</p>':''}</div></div>
    <div class="stage"><div class="num">3</div><div><h5>${esc(t.вопрос)}</h5>${input}
      <div class="calc" id="calc"><div class="big" id="res">${v?esc(v.текст)+' '+(v.статус!=='ошибка'?esc(t.единица):''):'—'}</div>
        <div class="why" id="why">${v?esc(v.пояснение||''):'пока стоит заводское значение'}</div></div>
      <div class="btns"><button class="btn pri" id="save" disabled>Сохранить</button>
        ${v?'<button class="btn" id="clear">Стереть замер</button>':''}</div></div></div>`;
  const setDraft=(x,from)=>{draft=(x===''||x==null||isNaN(x))?null:+x;
    document.querySelectorAll('#work .pick button').forEach(b=>b.classList.toggle('on',draft!=null&&Math.abs(+b.dataset.v-draft)<1e-9));
    const n=$('num'), r=$('rng'); if(n&&from!=='num')n.value=draft??''; if(r&&from!=='rng'&&draft!=null)r.value=draft; preview()};
  document.querySelectorAll('#work .pick button').forEach(b=>b.onclick=()=>setDraft(b.dataset.v));
  if($('num')){$('num').oninput=e=>setDraft(e.target.value,'num');$('num').onkeydown=e=>{if(e.key==='Enter')save()}}
  if($('rng'))$('rng').oninput=e=>setDraft(e.target.value,'rng');
  if($('rep'))$('rep').onchange=e=>{repeat=e.target.checked;preview()};
  $('save').onclick=save;
  if($('clear'))$('clear').onclick=async()=>done(await send('стереть',{катушка:sel,тест:tst}));
  if($('selectSpool'))$('selectSpool').onclick=async e=>{
    const button=e.currentTarget, имя=sel;
    button.disabled=true;
    const r=await send('выбрать_катушку',{катушка:имя});
    button.disabled=false;
    if(!r.ок)return fail(r);
    if(sel===имя&&tst===t.ключ&&$('was'))$('was').textContent='Катушка выбрана в первом слоте.';
  };
  if($('open'))$('open').onclick=async()=>{const key=sel+'|'+tst, r=await send('плита',{катушка:sel,тест:tst,открыть:true});
    if(!r.ок)return fail(r);
    if(r.открыто===true){loaded[key]=true; if($('was'))$('was').textContent='Плита загружена'}
    else banner('Не получилось загрузить плиту в окно Orca'+(r.открыто?': '+r.открыто:'')+'. Открой файл через «Файл → Открыть проект»: '+r.путь,'warn')};
  if(draft!=null) setDraft(draft);
}
let pv=0;
function preview(){
  clearTimeout(preview.h); const my=++pv;
  if(draft==null){$('save').disabled=true;return}
  preview.h=setTimeout(async()=>{
    const r=await send('прикинуть',{катушка:sel,тест:tst,замер:draft,повтор:repeat});
    if(my!==pv||!$('calc'))return; const t=test();
    const bad=!r.ок||r.ошибка; $('calc').classList.toggle('err',!!bad);
    $('res').textContent=bad?(r.ошибка||'ошибка'):r.текст+' '+t.единица; $('why').textContent=bad?'':r.пояснение;
    $('save').disabled=!!bad;
  },90);
}
async function save(){
  if(draft==null||$('save').disabled)return;
  const key=sel+'|'+tst; const r=await send('внести',{катушка:sel,тест:tst,замер:draft,повтор:repeat});
  if(r.ок)delete loaded[key];
  done(r,true);
}
function done(r,advance){
  if(!r.ок)return fail(r);
  S=r.состояние; draft=null; repeat=true;
  const p=r.пресет||{}; toast(p.сообщение||'Готово');
  if(p.катушка){
    sel=p.катушка;spoolMaterial='';
    spoolPage=Math.max(0,Math.floor(sortedSpools().findIndex(k=>k.имя===sel)/perPage));
  }
  if(p.дом==='пользовательский')banner('Сохранено. Эта катушка заведена до плагина — перезапусти Orca, прежде чем печатать следующий тест.','warn');
  else if(p.перечитано===true)banner('Сохранено. Orca уже видит новое значение.');
  else if(p.перечитано)banner('Сохранено, но Orca не перечитала пресет: '+p.перечитано+' Перезапусти Orca.','warn');
  else $('banner').classList.remove('show');
  if(advance&&!test()?.необязательный){const k=spool(), n=k&&nextKey(k); if(n)tst=n}
  smooth(renderAll);
}

/* ── что выбрано в Orca ── */
let checkRequest=0;
document.addEventListener('visibilitychange',()=>{
  if(S&&document.visibilityState==='visible')check();
});
async function check(){
  const request=++checkRequest;
  const r=await send('выбор');
  if(request!==checkRequest)return;
  if(!r.ок){$('check').innerHTML=`<div class="note">${esc(r.ошибка||'Недоступно')}</div>`;return}
  if(followOrcaSpool(r.выбор))renderAll();
  $('check').innerHTML=`<div class="note" style="margin:0 0 6px">${esc(r.выбор.принтер||'')}<br>${esc(r.выбор.процесс||'')}</div>`
    +(r.замечания.map(m=>`<div class="msg ${esc(m.уровень)}">${esc(m.текст)}</div>`).join('')||'<div class="note">Замечаний нет.</div>');
}

/* ── новая катушка ── */
let baseRequest=0;
async function loadBases(){
  const request=++baseRequest, material=$('nMat').value;
  $('nBase').innerHTML='';
  $('dlg').querySelector('[type=submit]').disabled=true;
  $('nBaseInfo').textContent='Загрузка профилей…';
  const r=await send('базы',{материал:material});
  if(request!==baseRequest)return;
  if(!r.ок){$('nBaseInfo').textContent=r.ошибка;return}
  $('nBase').innerHTML=r.базы.map(name=>'<option value="'+esc(name)+'">'+esc(name)+'</option>').join('');
  $('dlg').querySelector('[type=submit]').disabled=!r.базы.length;
  $('nBaseInfo').textContent=r.базы.length?'Профиль выбран автоматически. При необходимости его можно изменить.':'Нет совместимых профилей этого материала. Добавь такой профиль в Orca.';
}
$('nMat').onchange=loadBases;
$('add').onclick=()=>{ if(!S)return;
  $('nMat').innerHTML=(S.порядок||Object.keys(S.материалы)).map(m=>`<option>${esc(m)}</option>`).join('');
  vendors.items=(S.производители||[]).slice();vendorOpen(false);
  $('nVendor').value='';$('nName').value='';$('nPreview').textContent='';$('nPreview').style.color='';$('veil').classList.add('show');$('nVendor').focus();loadBases()};
const nPrev=()=>{$('nPreview').style.color='';$('nPreview').textContent=($('nVendor').value||$('nName').value)?'В Orca пластик будет называться «'+($('nVendor').value+' '+$('nName').value).trim()+'»':''};
$('nVendor').oninput=$('nName').oninput=nPrev;

/* Производитель: свой список вместо <datalist>. Можно выбрать из списка или
   вписать своего — поле остаётся обычным текстом. */
const vendors={items:[],shown:[],active:-1};
function vendorOpen(on){
  const list=$('vendorList'), input=$('nVendor');
  list.hidden=!on; input.setAttribute('aria-expanded',String(on));
  if(!on){vendors.active=-1;input.removeAttribute('aria-activedescendant');return}
  // В низком окне Orca под полем может не хватить места — тогда список раскрывается вверх.
  const box=input.getBoundingClientRect(), need=Math.min(list.scrollHeight,228)+8;
  list.classList.toggle('up',innerHeight-box.bottom<need&&box.top>innerHeight-box.bottom);
}
function vendorRender(all){
  const q=$('nVendor').value.trim().toLowerCase();
  vendors.shown=all||!q?vendors.items:vendors.items.filter(v=>v.toLowerCase().includes(q));
  vendors.active=-1;
  $('vendorList').innerHTML=vendors.shown.map((v,i)=>{
    const at=q&&!all?v.toLowerCase().indexOf(q):-1;
    const text=at<0?esc(v):esc(v.slice(0,at))+'<mark>'+esc(v.slice(at,at+q.length))+'</mark>'+esc(v.slice(at+q.length));
    return `<li role="option" id="vendorOpt${i}" aria-selected="false">${text}</li>`}).join('');
  vendorOpen(vendors.shown.length>0);
}
function vendorMove(i,scroll){
  const n=vendors.shown.length;if(!n)return;
  vendors.active=(i+n)%n;
  const items=[...$('vendorList').children];
  items.forEach((li,k)=>li.setAttribute('aria-selected',String(k===vendors.active)));
  $('nVendor').setAttribute('aria-activedescendant',items[vendors.active].id);
  if(scroll)items[vendors.active].scrollIntoView({block:'nearest'});
}
function vendorPick(i){$('nVendor').value=vendors.shown[i];vendorOpen(false);nPrev()}
$('nVendor').addEventListener('input',()=>vendorRender(false));
$('nVendor').addEventListener('blur',()=>vendorOpen(false));
$('nVendor').addEventListener('keydown',e=>{
  const open=!$('vendorList').hidden;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!open)vendorRender(false);
    vendorMove(vendors.active<0?(e.key==='ArrowDown'?0:-1):vendors.active+(e.key==='ArrowDown'?1:-1),true);
  }else if(!open){return}
  else if(e.key==='Enter'&&vendors.active>=0){e.preventDefault();vendorPick(vendors.active)}
  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();vendorOpen(false)}
  else if(e.key==='Tab'){vendorOpen(false)}
});
// Нажатие в списке не должно уводить фокус из поля, иначе список закроется до выбора.
$('vendorList').addEventListener('mousedown',e=>e.preventDefault());
$('vendorList').addEventListener('click',e=>{const li=e.target.closest('li');if(li)vendorPick([...$('vendorList').children].indexOf(li))});
$('vendorList').addEventListener('mousemove',e=>{const li=e.target.closest('li');if(li&&li.getAttribute('aria-selected')!=='true')vendorMove([...$('vendorList').children].indexOf(li),false)});
$('vendorToggle').addEventListener('mousedown',e=>e.preventDefault());
$('vendorToggle').onclick=()=>{if($('vendorList').hidden){$('nVendor').focus();vendorRender(true)}else vendorOpen(false)};
$('nCancel').onclick=()=>$('veil').classList.remove('show');
$('veil').onclick=e=>{if(e.target===$('veil'))$('veil').classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('veil').classList.remove('show')});
$('dlg').onsubmit=async e=>{e.preventDefault();
  const r=await send('новая',{материал:$('nMat').value,база:$('nBase').value,производитель:$('nVendor').value,название:$('nName').value});
  if(!r.ок){$('nPreview').textContent=r.ошибка;$('nPreview').style.color='var(--bad)';return}
  $('veil').classList.remove('show');sel=r.пресет.катушка;tst=null;done(r)};

let hostInfo={};
function diag(){
  $('diagText').textContent=JSON.stringify({хост:hostInfo,пути:S&&S.пути,базы_известны:S&&S.базы_известны,беды:S&&S.беды,ошибки:log.slice(0,3)},null,1);
}

(async()=>{
  applyTheme();
  const r=await send('состояние');
  if(!r.ок){$('content').innerHTML=`<div class="glass empty">${esc(r.ошибка)}<pre>${esc(r.след||'')}</pre></div>`;return}
  S=r.состояние; hostInfo=r.хост||{};
  if(THEMES.includes((S.настройки||{}).тема)){theme=S.настройки.тема;applyTheme()}

  followOrcaSpool(r.выбор);
  renderAll(); check();
})();
</script>
</body>
</html>
