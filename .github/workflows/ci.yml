name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 runs everything, plugin included: OrcaSlicer 2.5 embeds a modern
        # Python and the plugin needs 3.10+. 3.9 keeps the release tooling honest
        # on an old interpreter; the plugin tests skip themselves there. The job
        # names are required checks on main, so keep them.
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install the plugin's mesh libraries
        # The plugin declares these in its metadata and OrcaSlicer installs them.
        if: matrix.python != '3.9'
        run: python -m pip install trimesh numpy shapely mapbox-earcut DracoPy scipy

      - name: Check that the plugin builds into one file
        if: matrix.python != '3.9'
        run: python plugin/build.py dist/kalibrovka.py

      - name: Run tests
        run: python -m pytest tests/ -q

  syntax:
    name: Syntax and byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every module
        run: python -m compileall -q plugin tools tests

  safety:
    name: Public-safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the repository for private data
        # Non-zero exit fails the build. This runs on every pull request,
        # including from forks, which is the case it exists for.
        run: python tools/check_public_safety.py

  release-archive:
    name: Build and inspect the release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python tools/build_release.py --version ci

      - name: Scan the archive itself
        # The repository being clean does not prove the archive is: the build
        # step chooses what goes in, and that choice is what ships.
        run: python tools/check_public_safety.py dist/*.zip

      - name: Check the archive contents
        run: python tools/build_release.py --verify dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: dist/*.zip
          retention-days: 7
