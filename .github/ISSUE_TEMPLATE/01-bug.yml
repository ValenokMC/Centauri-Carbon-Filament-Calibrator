name: Bug report
description: Something works differently from how it is documented
title: "[bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Before you attach anything:** a `.3mf` you saved from OrcaSlicer
        yourself may contain your printer's network address. So may your
        OrcaSlicer profile folder. Please check, or do not attach them.

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: OrcaSlicer → Plugins shows it.
      placeholder: 0.8.0
    validations:
      required: true

  - type: input
    id: orca
    attributes:
      label: OrcaSlicer version
      description: Help → About.
      placeholder: 2.5.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: printer
    attributes:
      label: Printer profile and nozzle
      placeholder: Elegoo Centauri Carbon 0.4 nozzle
    validations:
      required: true

  - type: dropdown
    id: material
    attributes:
      label: Material
      options: [PLA, PETG, PETG-CF, PETG-GF, ABS, ASA, PA, TPU, Other]
    validations:
      required: true

  - type: dropdown
    id: test
    attributes:
      label: Which test
      options:
        - Temperature
        - Flow
        - Shrinkage
        - Pressure advance
        - Max volumetric flow
        - Retraction
        - Not test-specific (spool list, presets, nozzles, interface)
    validations:
      required: true

  - type: textarea
    id: measured
    attributes:
      label: What you measured and what the tab computed
      placeholder: |
        Entered 12 mm on the pressure-advance tower.
        The tab saved PA 0.024.
        The sharpest band was at 12 mm, I expected about 0.03.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика
      description: The text of the "Диагностика" section at the bottom of the tab.
      render: text

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I am not attaching a `.3mf` that I have not checked for `print_host`.
          required: true
        - label: I am not attaching my whole `Журнал.csv` or my OrcaSlicer profile folder.
          required: true
        - label: There is no personal data in this report — no printer IP address, no account name, no unredacted user paths.
          required: true
