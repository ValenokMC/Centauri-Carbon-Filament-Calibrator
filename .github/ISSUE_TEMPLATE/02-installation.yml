name: Installation problem
description: The plugin does not install, does not load, or the tab stays empty
title: "[install] "
labels: ["installation", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        If the tab opens at all, copy the text of its **Диагностика** section
        (bottom of the tab) into the field below.

  - type: dropdown
    id: stage
    attributes:
      label: Where it stops
      options:
        - Orca refuses to install the plugin file
        - Orca fails to install the plugin's libraries
        - The plugin is installed but the tab does not appear
        - The tab is empty or shows an error
        - A new spool does not appear in Orca's filament list
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: OrcaSlicer → Plugins shows it.
      placeholder: 0.8.0
    validations:
      required: true

  - type: input
    id: orca
    attributes:
      label: OrcaSlicer version
      placeholder: 2.5.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: account
    attributes:
      label: Are you signed in to an OrcaSlicer account?
      description: >
        This decides which profile folder Orca reads, and it is the usual
        explanation for a preset that is written but never appears.
      options: ["Yes", "No", "I do not know"]
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика / error text
      render: text

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I have replaced my Windows user name with USER in any path above, or I am happy for it to be public.
          required: true
